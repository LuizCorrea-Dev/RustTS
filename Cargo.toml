[package]
name = "rtsc"
version = "2.0.0-rts"
edition = "2021"
authors = ["Luiz Correa - Rootszera"]
description = "RustTS (.rts) Deterministic Systems & Engine Compiler for Humans and AI"
license = "MIT OR Apache-2.0"

[package.metadata.rustts]
release_year = 2026
copyright = "Copyright (c) 2026 Luiz Correa (Rootszera)"

[[bin]]
name = "rtsc"
path = "src/main.rs"

[lib]
name = "rtsc_core"
path = "src/lib.rs"

[dependencies]
logos = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

