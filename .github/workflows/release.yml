name: Release RustTS Binaries (rtsc)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: rtsc.exe
            asset_name: rtsc-windows-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: rtsc
            asset_name: rtsc-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: rtsc
            asset_name: rtsc-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run Compiler Unit Tests
        run: cargo test --release

      - name: Build Optimized Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Release Asset
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} ${{ matrix.asset_name }}

      - name: Publish Binary to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: "RustTS v2.3.0-rts — Backend Godot 4 (GDExtension/SCons), HAL FPS/Áudio/Rede, Vulkan PBR RHI & Ferramentas Nativas"
          body_path: RELEASE_NOTES_v2.3.0.md
          files: ${{ matrix.asset_name }}

